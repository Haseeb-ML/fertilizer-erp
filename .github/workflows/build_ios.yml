name: Build iOS & Android Mobile Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from GitHub web UI

jobs:
  # 🍏 Job 1: Build iOS (Runs on GitHub's free Cloud Mac)
  build-ios:
    name: Build iOS (iPhone)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Automated Tests
        run: flutter test

      - name: Build iOS Application (Release)
        run: flutter build ios --release --no-codesign

      - name: Package iOS App (.ipa / Payload)
        run: |
          mkdir -p build/ios/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/Payload/
          cd build/ios
          zip -r -q fertilizer-erp-ios.ipa Payload
          zip -r -q fertilizer-erp-ios.zip Payload

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fertilizer-erp-ios-build
          path: |
            build/ios/fertilizer-erp-ios.ipa
            build/ios/fertilizer-erp-ios.zip
          retention-days: 14

  # 🤖 Job 2: Build Android Release APK
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fertilizer-erp-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
